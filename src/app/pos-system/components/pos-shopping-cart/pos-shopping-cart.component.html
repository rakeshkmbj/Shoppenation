<div class="shopping-cart-container">
  <div class="cart-header">
    <h3 class="cart-title">SHOPPING CART</h3>
    <span class="items-count" *ngIf="items && items.length > 0">
      ({{ items.length }} items)
    </span>
  </div>

  <div class="cart-items-list" *ngIf="items && items.length > 0">
    <div class="cart-item" *ngFor="let item of items; let i = index">
      <div class="item-number">{{ i + 1 }}</div>

      <div class="item-details">
        <div class="item-info">
          <div class="item-name">{{ item.product.name }}</div>
          <div class="item-sku">{{ item.product.sku }}</div>
        </div>
      </div>

      <div class="item-qty">
        <button class="qty-btn" (click)="decreaseQty(item.product.id)">−</button>
        <input type="text" class="qty-value" [value]="item.quantity" readonly>
        <button class="qty-btn" (click)="increaseQty(item.product.id)">+</button>
      </div>

      <div class="item-price">
        <div class="price-row">
          <span class="price-label">₹</span>
          <span class="price-value">{{ item.price * item.quantity | number: '1.2-2' }}</span>
        </div>
        <div class="discount-row" *ngIf="item.discount > 0">
          <span class="discount-label">-₹{{ item.discount | number: '1.2-2' }}</span>
        </div>
        <div class="mrp-row">
          <span class="mrp-value">₹{{ item.mrpTotal | number: '1.2-2' }}</span>
        </div>
      </div>

      <div class="item-actions">
        <button class="action-btn discount-btn" title="Apply Discount">💰</button>
        <button class="action-btn remove-btn" (click)="onRemoveItem(item.product.id)" title="Remove">✕</button>
      </div>
    </div>
  </div>

  <div class="empty-cart" *ngIf="!items || items.length === 0">
    <div class="empty-icon">🛒</div>
    <p>Cart is Empty</p>
    <span>Add items to get started</span>
  </div>
</div>
