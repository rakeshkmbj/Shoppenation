<aside class="pos-sidebar">
  <div class="sidebar-logo">
    <span class="logo-icon">🏪</span>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-item" [class.active]="activeNav === 'dashboard'" (click)="setActiveNav('dashboard')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">DASHBOARD</span>
    </div>

    <div class="nav-item" [class.active]="activeNav === 'terminal'" (click)="setActiveNav('terminal')">
      <span class="nav-icon">🖥️</span>
      <span class="nav-label">TERMINAL POS</span>
    </div>

    <div class="nav-item" [class.active]="activeNav === 'orders'" (click)="setActiveNav('orders')">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">ORDERS</span>
    </div>

    <div class="nav-item" [class.active]="activeNav === 'sync'" (click)="setActiveNav('sync')">
      <span class="nav-icon">🔄</span>
      <span class="nav-label">SYNC</span>
    </div>
  </nav>

  <div class="sidebar-categories">
    <div class="categories-header">
      <h4>Categories</h4>
    </div>
    <div class="categories-list">
      <div *ngFor="let category of categories" 
           class="category-item" 
           [class.active]="category.id === selectedCategory"
           (click)="selectCategory(category.id)">
        <span class="category-name">{{ category.name }}</span>
        <span class="category-count" *ngIf="category.count">{{ category.count }}</span>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <button class="logout-btn">Logout</button>
  </div>
</aside>
