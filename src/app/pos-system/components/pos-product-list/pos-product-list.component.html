<div class="product-list-container">

  <div class="category-tabs">
    <button class="category-tab" [class.active]="activeTab === 'categories'"
      (click)="selectTab('categories')">Categories</button>
    <button class="category-tab" [class.active]="activeTab === 'top-in-demand'" (click)="selectTab('top-in-demand')">Top
      in Demand</button>
    <button class="category-tab" [class.active]="activeTab === 'all-products'" (click)="selectTab('all-products')">All
      Products</button>
  </div>

  <div class="filter-row">
    <div class="filter-field">
      <label>Product Lines</label>
      <select class="custom-select" (change)="onProductLineChange($event.target.value)">
        <option value="">All lines</option>
        <option *ngFor="let line of productLines" [value]="line">
          {{ line }}
        </option>
      </select>
    </div>
    <div class="filter-field">
      <label>Item Categories</label>
      <select class="custom-select" (change)="onItemCategoryChange($event.target.value)">
        <option value="">All categories</option>
        <option *ngFor="let category of itemCategories" [value]="category">
          {{ category }}
        </option>
      </select>
    </div>
  </div>

  <div class="products-grid" *ngIf="filteredProducts && filteredProducts.length > 0">
    <div *ngFor="let product of filteredProducts" class="product-card">
      <div class="product-image">
        <img [src]="product.image" [alt]="product.name" (error)="onImageError($event)">
        <div class="product-badge">
          <span *ngIf="product.stock > 0" class="in-stock">In Stock</span>
          <span *ngIf="product.stock === 0" class="out-stock">Out of Stock</span>
        </div>
      </div>

      <div class="product-info">
        <h4 class="product-name">{{ product.name }}</h4>
        <div class="product-sku">SKU: {{ product.sku }}</div>

        <div class="product-prices">
          <span class="price">₹{{ product.price }}</span>
          <span class="mrp">MRP: ₹{{ product.mrp }}</span>
        </div>

        <div class="product-actions">
          <input type="number" class="qty-input" min="1" [value]="selectedQuantity[product.id] || 1"
            (change)="updateSelectedQty(product.id, $event)">
          <button class="btn-add" (click)="onAddToCart(product)" [disabled]="product.stock === 0">
            ADD TO CART
          </button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="filteredProducts && filteredProducts.length === 0" class="no-products">
    <div class="no-products-icon">📦</div>
    <p>No products found</p>
  </div>
</div>
