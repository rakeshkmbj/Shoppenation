<div class="product-list-container">
  <div class="search-and-controls">
    <div class="search-section">
      <input type="text" 
             class="search-input" 
             placeholder="Search by Product / Brand / SKU / Barcode"
             (keyup)="onSearch($event)">
      <span class="search-icon">🔍</span>
    </div>

    <div class="control-buttons">
      <button class="btn-barcode" title="Barcode Scanner">
        <span class="icon">📱</span>
        <span>BARCODE</span>
      </button>
      <button class="btn-qr" title="QR Code Scanner">
        <span class="icon">📷</span>
        <span>QR SCAN</span>
      </button>
      <button class="btn-voice" title="Voice Search">
        <span class="icon">🎤</span>
        <span>VOICE SEARCH</span>
      </button>
    </div>
  </div>

  <div class="category-tabs">
    <button class="category-tab active">All Categories</button>
    <button class="category-tab">Top Products</button>
    <div class="tab-recent">
      <span class="recent-label">RECENT</span>
    </div>
  </div>

  <div class="products-grid">
    <div *ngFor="let product of products" class="product-card">
      <div class="product-image">
        <img [src]="product.image" [alt]="product.name" (error)="onImageError($event)">
        <div class="product-badge">
          <span *ngIf="product.stock > 0" class="in-stock">In Stock</span>
          <span *ngIf="product.stock === 0" class="out-stock">Out of Stock</span>
        </div>
      </div>

      <div class="product-info">
        <h4 class="product-name">{{ product.name }}</h4>
        <div class="product-sku">SKU: {{ product.sku }}</div>

        <div class="product-prices">
          <span class="price">₹{{ product.price }}</span>
          <span class="mrp">MRP: ₹{{ product.mrp }}</span>
        </div>

        <div class="product-actions">
          <input type="number" 
                 class="qty-input" 
                 min="1" 
                 [value]="selectedQuantity[product.id] || 1"
                 (change)="updateSelectedQty(product.id, $event)">
          <button class="btn-add" 
                  (click)="onAddToCart(product)"
                  [disabled]="product.stock === 0">
            ADD TO CART
          </button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="products && products.length === 0" class="no-products">
    <div class="no-products-icon">📦</div>
    <p>No products found</p>
  </div>
</div>
