<div class="content">

    <h1 class="heading-title">Card Access Management</h1>

    <form [formGroup]="cardAccessForm">

        <!-- ======================= -->
        <!-- Identification Section -->
        <!-- ======================= -->

        <div class="card mb-4">

            <div class="card-body">

                <div class="row align-items-center">

                    <!-- RFID -->

                    <div class="col-lg-5">

                        <h5 class="sub-title">
                            Registered User Mobile
                        </h5>

                        <input type="text" class="form-control form-control-lg" placeholder="Enter Mobile Number"
                            formControlName="mobilenumber">

                        <button type="button" class="btn custom-btnn w-100 mt-4" (click)="getCardIdentification()">

                            <i class="fa fa-credit-card me-2"></i>

                            Get Card Identification

                        </button>

                    </div>

                    <!-- Divider -->

                    <div class="col-lg-2 text-center">

                        <div class="or-divider">

                            <span>OR</span>

                        </div>

                    </div>

                    <!-- QR -->

                    <div class="col-lg-5 text-center">

                        <h5 class="sub-title">

                            Scan QR Code

                        </h5>

                        <div class="qr-box">

                            <img src="assets/images/sampleQR.png" class="img-fluid">

                        </div>

                        <button type="button" class="btn custom-btnn mt-4">

                            <i class="fa fa-qrcode me-2"></i>

                            Scan QR for Identification

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- ======================= -->
        <!-- User Details -->
        <!-- ======================= -->

        <div class="card mt-4">

            <div class="card-header section-header">
                <i class="fa fa-user-circle me-2"></i>
                User Identity Details
            </div>

            <div class="card-body">

                <div class="row">

                    <!-- Left Details -->

                    <div class="col-lg-8">

                        <div class="row">

                            <div class="col-md-6 mb-4">
                                <label>Reg ID</label>
                                <h6>{{cardDetails.REGID}}</h6>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label>Passport ID</label>
                                <h6>{{cardDetails.PASSPORT_ID}}</h6>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label>First Name</label>
                                <h6>{{cardDetails.FIRST_NAME}}</h6>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label>Last Name</label>
                                <h6>{{cardDetails.LAST_NAME}}</h6>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label>Mobile Number</label>
                                <h6>{{cardDetails.MOBILE}}</h6>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label>Generated From</label>
                                <h6>{{cardDetails.GENERATED_FROM}}</h6>
                            </div>

                        </div>

                        <hr>

                        <div class="status-container">

                            <!-- Validity -->
                            <div class="status-item">

                                <label>Validity</label>

                                <span class="status-badge success">
                                    <i class="fa fa-check"></i>
                                    Active
                                </span>

                            </div>

                            <!-- Suspended -->
                            <div class="status-item">

                                <label>Suspended</label>

                                <span class="status-badge success">
                                    No
                                </span>

                            </div>

                            <!-- Verification -->
                            <div class="status-item">

                                <label>Verification</label>

                                <span class="status-badge success">
                                    <i class="fa fa-check-circle"></i>
                                    Verified User
                                </span>

                            </div>

                        </div>

                    </div>

                    <!-- Right Image -->

                    <div class="col-lg-4 text-center">

                        <div class="holder-image">

                            <img *ngIf="cardDetails.IMAGE" [src]="cardDetails.IMAGE">

                            <div *ngIf="!cardDetails.IMAGE" class="placeholder-image">

                                <i class="fa fa-user fa-5x"></i>

                            </div>

                        </div>

                    </div>

                </div>

                <hr>

                <div class="row mt-4 align-items-start">

                    <!-- Left Side -->
                    <div class="col-lg-4">

                        <button class="btn btn-dark authenticate-btn" type="button">

                            <i class="fa fa-user-check me-2"></i>
                            Authenticate User

                        </button>

                    </div>

                    <!-- Right Side -->
                    <div class="col-lg-8">

                        <!-- OTP Row -->

                        <div class="validation-section">

                            <label class="validation-label">

                                Validation Reference

                            </label>

                            <div class="otp-box mt-2">

                                <input maxlength="1" class="otp-input">

                                <input maxlength="1" class="otp-input">

                                <input maxlength="1" class="otp-input">

                                <input maxlength="1" class="otp-input">

                            </div>

                            <button class="btn custom-btnn ms-2 mt-4" type="button">

                                Validate

                            </button>


                        </div>

                        <!-- Buttons Row -->

                        <div class="d-flex justify-content-end gap-8 mt-4">

                            <button class="btn custom-btnn" type="button" (click)="openBrandCommercePOS()">

                                Take user order on terminal

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </form>

</div>
