<div class="content">

    <h1 class="heading-title">Card Access Management</h1>

    <div class="toplevel">

        <form [formGroup]="cardAccessForm">

            <!-- Top Section -->
            <div class="card p-3 mb-4">

                <div class="row align-items-center">

                    <!-- RFID -->
                    <div class="col-md-5">

                        <label><b>Card Tag Id</b></label>

                        <input type="text" class="form-control" formControlName="cardTagId"
                            placeholder="Place Card on Reader">

                        <button type="button" class="btn custom-btn mt-3" (click)="getCardIdentification()">
                            Get Card Identification
                        </button>

                    </div>

                    <div class="col-md-2 text-center">

                        <div class="divider">

                            <span>OR</span>

                        </div>

                    </div>

                    <!-- QR -->
                    <div class="col-md-5 text-center">

                        <img src="assets/images/sampleQR.png" class="qr-image">

                        <br><br>

                        <button type="button" class="btn custom-btn">
                            Scan QR for Identification
                        </button>

                    </div>

                </div>

            </div>

            <!-- Card Details -->

            <div class="card">

                <div class="card-body">

                    <div class="row">

                        <!-- Left -->

                        <div class="col-md-8">

                            <div class="detail-row">

                                <span><b>Regid :</b></span>
                                {{cardDetails.REGID}}

                                &nbsp;&nbsp;

                                <span><b>Validity :</b></span>

                                <span *ngIf="cardDetails.VALID">
                                    <img src="assets/images/active_icon1.png" width="22">
                                </span>

                                <span *ngIf="!cardDetails.VALID">
                                    <img src="assets/images/deactive_icon.png" width="22">
                                </span>

                                &nbsp;&nbsp;

                                <span><b>Suspended</b></span>

                                <span *ngIf="cardDetails.SUSPENDED">
                                    ❌
                                </span>

                                <span *ngIf="!cardDetails.SUSPENDED">
                                    ✔
                                </span>

                            </div>

                            <br>

                            <p>
                                <b>Card Generated From :</b>

                                {{cardDetails.GENERATED_FROM}}
                            </p>

                            <p>

                                <b>First Name :</b>

                                {{cardDetails.FIRST_NAME}}

                                &nbsp;&nbsp;

                                <b>Last Name :</b>

                                {{cardDetails.LAST_NAME}}

                            </p>

                            <p>

                                <b>Primary Mobile # :</b>

                                {{cardDetails.MOBILE}}

                            </p>

                        </div>

                        <!-- Right -->

                        <div class="col-md-4 text-center">

                            <div class="holder-image">

                                <img *ngIf="cardDetails.IMAGE" [src]="cardDetails.IMAGE">

                            </div>

                            <h5 class="mt-2">
                                Card Holder Image
                            </h5>

                        </div>

                    </div>

                </div>

            </div>

            <div class="row mt-4">
                <div class="col-md-12 text-center">

                    <button type="button" class="btn brand-pos-btn" (click)="openBrandCommercePOS()">

                        <i class="fa fa-shopping-cart me-2"></i>
                        Brand Commerce POS

                    </button>

                </div>
            </div>

        </form>

    </div>

</div>
